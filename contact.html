        <aside>

            <!--<h1>Sidefelt</h1>-->


        </aside>

        <article class="main">

        <h1 class="page-heading">Kontakt</h1>

            <div id="form">

                <form action="https://formsubmit.co/markjohanj@gmail.com" method="post">

                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_honey" style="display:none">

                    <p>
                    <label for="name">Navn:</label>
                    <input id="name" type="text" name="name" placeholder="Ditt Navn" required>
                    </p>

                    <p>
                    <label for="email">Email:</label>
                    <input id="email" type="email" name="email" required>
                    </p>

                    <p>
                    <label for="subject">Tema:</label>
                    <input id="subject" type="text" name="subject">
                    </p>

                    <p>
                    <label for="message">Melding:</label>
                    <textarea id="message" name="message" cols="30" rows="10" required></textarea>
                    </p>

                    <p>
                        <input id="submit" type="submit" name="submit" value="Send Melding">
                    </p>
                    
                </form>

            </div>






        </article>
